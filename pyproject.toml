[project]
name = "itx-seat-matrix"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",     # argon2id 해시 (PLAN 6절). 직접 구현 금지
    "cryptography>=43.0",    # Fernet — 코레일 비밀번호/웹훅 URL 암호화 (Phase 2·3에서 사용)
    "korail2>=0.4.0",
    "apscheduler>=3.11",     # 인프로세스 30초 틱 (PLAN 9절). uvicorn --workers 1 전제
    "pywebpush>=2.0",        # 웹푸시 발송. **동기 라이브러리** → to_thread로 감싼다 (D-21)
    "httpx>=0.27",           # 디스코드 웹훅 (async). dev 그룹에서 런타임으로 승격
]

# korail2(+ DynaPath 우회 벤더링, D-22)는 Phase 2에서 추가했다.
# apscheduler/pywebpush/httpx는 Phase 3(알림 + 자동화)에서 추가했다.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",           # fastapi TestClient
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
