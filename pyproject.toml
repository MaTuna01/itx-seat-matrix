[project]
name = "itx-seat-matrix"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",     # argon2id 해시 (PLAN 6절). 직접 구현 금지
    "cryptography>=43.0",    # Fernet — 코레일 비밀번호/웹훅 URL 암호화 (Phase 2·3에서 사용)
]

# korail2(+ DynaPath 우회 벤더링, D-22)는 Phase 2에서 추가한다.
# pywebpush(알림 발송)는 Phase 3에서 추가한다.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",           # fastapi TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
